version: "2"
sql:
  - engine: "postgresql"
    queries: ["pkg/database/queries/*.sql", "pkg/database/queries/read_dependency_draft/", "pkg/database/queries/read_dependency_archive/", "pkg/database/queries/read_draft/ontology.sql"]
    schema: "pkg/database/migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "pkg/database/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
