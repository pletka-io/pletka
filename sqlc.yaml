version: "2"
sql:
  - engine: "postgresql"
    queries: "store/queries/"
    schema: "store/migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "store/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
