version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/database/queries/*.sql"
    schema: "pkg/database/migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "pkg/database/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
  - engine: "postgresql"
    queries: "pkg/database/queries/read_draft/"
    schema: "pkg/database/migrations/"
    gen:
      go:
        package: "draft"
        out: "pkg/database/readsql/draft"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
  - engine: "postgresql"
    queries: "pkg/database/queries/read_archive/"
    schema: "pkg/database/migrations/"
    gen:
      go:
        package: "archive"
        out: "pkg/database/readsql/archive"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
