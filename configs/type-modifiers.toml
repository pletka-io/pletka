# Type Modifiers Configuration
# ============================
# Maps CRM/ontology class codes to URI type segments.
# Used for building /ns/{segment}/{id} URIs.
#
# Format:
#   [class.<prefix>] maps class codes to segments
#   e.g., E21 = "actor" means E21 maps to /ns/actor/{id}
#
# Sources:
#   - CIDOC-CRM: http://www.cidoc-crm.org/cidoc-crm/
#   - CRMsurv: https://takin.solutions/ontologies/CRMSurv/
#   - AAO: https://ontology.swissartresearch.net/aaao/
#   - Linked Art: https://linked.art/ns/terms/
#   - CRMdig: http://www.ics.forth.gr/isl/CRMdig/

# CRM Core Classes
