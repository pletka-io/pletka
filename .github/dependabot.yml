version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    reviewers: ["kiivihal"]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # Without grouping, five unrelated patch bumps fill
      # open-pull-requests-limit on their own and Dependabot then stops
      # opening anything new -- including security updates. Minor and patch
      # updates arrive as one reviewable PR; majors stay separate so a
      # breaking change is never bundled with routine bumps.
      go-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    reviewers: ["kiivihal"]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      svelte:
        patterns:
          - "svelte"
          - "svelte-*"
          - "@sveltejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      typescript:
        patterns:
          - "typescript"
          - "@tsconfig/*"
          - "@types/*"
      vite:
        patterns:
          - "vite"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    reviewers: ["kiivihal"]
    commit-message:
      prefix: "ci"
      include: scope
