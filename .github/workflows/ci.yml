name: ci
on: [push, pull_request]
jobs:
  build-test-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so golangci-lint --new-from-merge-base can diff the
          # branch against main (enforce NEW issues only, not the backlog).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # The Go binary embeds the built frontend (pkg/assets/embed.go:
      # //go:embed all:static/dist). static/dist is gitignored (Vite output),
      # so it must be built before `go build` / lint, or the embed fails with
      # "pattern all:static/dist: no matching files found".
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v7
        with: { go-version: '1.26.6' }
      - run: go build ./...
      # Lint gate — golangci-lint v2 (staticcheck + suite, .golangci.yml) via
      # `go tool` so the version pinned in go.mod is used, matching local dev.
      # --new-from-merge-base blocks only issues this branch introduces vs main;
      # the ~2.5k-issue backlog is cleaned separately (`make lint`).
      - run: git fetch origin main
      - run: go tool golangci-lint run --new-from-merge-base=origin/main ./...
      - run: go test ./...
      # Vulnerability gate — pinned via `go tool` (same version as local).
      - run: go tool govulncheck ./...

  # Integration lane: hydrates the real-project fixtures (AME/LA/ING, the
  # private pletka-fixtures submodule) into a testcontainers Postgres and
  # runs every `//go:build integration` test — restore fidelity, ontology
  # smokes, pathaudit, the works. Template build ~7s, whole lane ~10s wall
  # locally; runner Docker is a bit slower but the same order of magnitude.
  #
  # REQUIRES the FIXTURES_SUBMODULE_TOKEN repo secret: a fine-grained PAT
  # with Contents:read on BOTH pletka-io/pletka and pletka-io/pletka-fixtures
  # — actions/checkout's `token:` replaces auth for the main repo as well as
  # submodules (learned the hard way with CORE_SUBMODULE_TOKEN, 2026-07-19).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.FIXTURES_SUBMODULE_TOKEN }}
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # `-tags=integration ./...` runs the untagged tests too, and the
      # frontend-manifest validation tests (pkg/app, pkg/assets, test/e2e)
      # check the real Vite build output — a static/dist placeholder is not
      # enough for this lane.
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v7
        with: { go-version: '1.26.6' }
      # REQUIRE_DB turns internal/testdb's skip into a failure. Without it this
      # lane reports "ok" having run nothing whenever the fixtures submodule is
      # missing or Docker is unavailable — a green tick on no evidence, which is
      # worse than a red one. In CI both are always meant to be present, so a
      # skip here means the lane is broken, not that there was nothing to run.
      - run: make test-integration
        env:
          REQUIRE_DB: '1'
