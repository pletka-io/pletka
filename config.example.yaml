# Pletka example configuration.
#
# Every key can also be set through environment variables by uppercasing the
# path and prefixing it with PLETKA_. For example:
#
#   PLETKA_SERVER_PORT=3333
#   PLETKA_LOG_FORMAT=json
#   PLETKA_DEBUG_PPROF_ENABLED=true

log:
  level: info
  format: text

database:
  # url overrides the individual connection fields when set.
  url: ""
  host: localhost
  port: "5432"
  name: pletka
  user: postgres
  password: ""
  sslmode: disable
  max_conns: 10
  min_conns: 0
  connect_timeout: 10s

migrate:
  timeout: 2m

server:
  host: localhost
  port: "8080"
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 10s

debug:
  pprof:
    enabled: false
    host: localhost
    port: "6060"
