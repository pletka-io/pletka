root = "."
tmp_dir = "tmp"

[build]
  # Configure to run on port 8080 by default with production env.
  args_bin = [
    "serve",
    "--port",
    "${PLETKA_PORT:-8080}",
    "--env",
    "production",
    "--config",
    "${PLETKA_CONFIG:-configs/config.yaml}",
  ]
  bin = "${PLETKA_BIN_DIR:-./tmp}/pletka"
  # Keep this in sync with .air.toml so production hot-reload reports
  # the same build metadata as local development and deploy scripts.
  cmd = "GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown) GIT_DIRTY=$(git diff --quiet 2>/dev/null || echo dirty) BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ); go build -ldflags \"-X github.com/pletka-io/pletka/pkg/buildinfo.Version=${PLETKA_VERSION:-dev} -X github.com/pletka-io/pletka/pkg/buildinfo.GitCommit=$GIT_COMMIT -X github.com/pletka-io/pletka/pkg/buildinfo.GitBranch=$GIT_BRANCH -X github.com/pletka-io/pletka/pkg/buildinfo.GitDirty=$GIT_DIRTY -X github.com/pletka-io/pletka/pkg/buildinfo.BuildTime=$BUILD_TIME\" -o ${PLETKA_BIN_DIR:-./tmp}/pletka ."
  delay = 1000
  exclude_dir = ["tmp", "vendor", "testdata", "docs", "scripts", "migrations", "configs", ".git", "node_modules", "frontend", ".codegraph", ".claude", "bin", "weave-stats"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "gohtml", "html", "css", "js", "yaml", "toml"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
